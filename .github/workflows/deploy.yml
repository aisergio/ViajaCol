name: Despliegue

# PR: solo compila el paquete de Lambda (evidencia de que se puede publicar).
# main: compila en GitHub (arm64) y publica en un runner de CodeBuild con aprobación de `production`.
# Manual: publicar de nuevo o restaurar una versión anterior sin recompilar.
#
# La aprobación va en su propio job, en un runner de GitHub. Así los jobs de CodeBuild se crean ya
# aprobados: si el job de CodeBuild esperara la aprobación, su runner (máximo 15 minutos) podría
# arrancar antes y apagarse sin trabajo (ADR 0005). Por eso los secretos DEPLOY_* son del
# repositorio y no del entorno.
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        type: choice
        options: [publicar, restaurar]
        default: publicar
      version:
        description: 'Versión de Lambda a restaurar (vacío = la anterior a la actual)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('paquete-{0}', github.ref) || 'despliegue-produccion' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-2
  PUBLIC_URL: https://aisergio.dev/ViajaCol

jobs:
  paquete:
    name: Paquete de Lambda (standalone)
    if: github.event_name != 'workflow_dispatch' || inputs.accion == 'publicar'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y empaquetar
        run: bash scripts/deploy/build-web.sh
        env:
          APP_VERSION: ${{ github.sha }}

      - name: Guardar el paquete
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-${{ github.sha }}
          path: dist/web
          retention-days: 7
          if-no-files-found: error

  aprobar:
    name: Aprobación de producción
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    environment:
      name: production
      url: https://aisergio.dev/ViajaCol
    timeout-minutes: 5
    steps:
      - name: Registrar la aprobación
        run: echo "Aprobado ($GITHUB_EVENT_NAME) para el commit $GITHUB_SHA"

  publicar:
    name: Publicar en producción
    needs: [paquete, aprobar]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.accion == 'publicar')
    # Runner de CodeBuild (infra/live/deploy.tf): solo acepta jobs de la cuenta del responsable.
    runs-on:
      - codebuild-viajacol-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      - publicar
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Traer el paquete
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-${{ github.sha }}
          path: dist/web

      - name: Publicar
        run: bash scripts/deploy/publish-web.sh
        env:
          STATIC_BUCKET: ${{ secrets.DEPLOY_STATIC_BUCKET }}
          ARTIFACTS_BUCKET: ${{ secrets.DEPLOY_ARTIFACTS_BUCKET }}
          FUNCTION_NAME: ${{ secrets.DEPLOY_FUNCTION_NAME }}
          DISTRIBUTION_ID: ${{ secrets.DEPLOY_DISTRIBUTION_ID }}

      - name: Prueba de humo
        run: bash scripts/deploy/smoke.sh
        env:
          EXPECTED_VERSION: ${{ github.sha }}
          CF_DOMAIN: ${{ secrets.DEPLOY_CF_DOMAIN }}
          FUNCTION_URL: ${{ secrets.DEPLOY_FUNCTION_URL }}

  restaurar:
    name: Restaurar versión
    needs: aprobar
    if: github.event_name == 'workflow_dispatch' && inputs.accion == 'restaurar'
    runs-on:
      - codebuild-viajacol-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      - restaurar
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mover el alias live
        run: bash scripts/deploy/rollback.sh
        env:
          FUNCTION_NAME: ${{ secrets.DEPLOY_FUNCTION_NAME }}
          DISTRIBUTION_ID: ${{ secrets.DEPLOY_DISTRIBUTION_ID }}
          TARGET_VERSION: ${{ inputs.version }}

      - name: Prueba de humo
        run: bash scripts/deploy/smoke.sh
        env:
          CF_DOMAIN: ${{ secrets.DEPLOY_CF_DOMAIN }}
          FUNCTION_URL: ${{ secrets.DEPLOY_FUNCTION_URL }}
