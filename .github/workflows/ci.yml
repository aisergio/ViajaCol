name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Calidad (lint, tipos, pruebas)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas unitarias con cobertura (Vitest)
        run: npm run test:coverage

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const file = "apps/web/coverage/coverage-summary.json";
            if (!fs.existsSync(file)) process.exit(0);
            const total = JSON.parse(fs.readFileSync(file, "utf8")).total;
            const rows = ["statements", "branches", "functions", "lines"].map((k) => `| ${k} | ${total[k].pct} % |`);
            const md = ["### Cobertura de modelos y ViewModels", "", "| Métrica | Valor |", "|---|---|", ...rows].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: apps/web/coverage/
          retention-days: 14
          if-no-files-found: ignore

  build-e2e:
    name: Build y E2E (Playwright + axe)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producción
        run: npm run build

      - name: Instalar Chromium de Playwright
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Pruebas de extremo a extremo (Playwright + axe)
        run: npm run e2e
        env:
          # Configuración de prueba de la cuenta (spec 006): no hay un Cognito real detrás y la clave
          # solo firma sesiones de esta corrida. Nada de esto es un secreto.
          AUTH_ORIGIN: http://localhost:3100
          AUTH_SECRET: e2e-solo-pruebas-e2e-solo-pruebas-e2e-solo-pruebas
          COGNITO_USER_POOL_ID: us-east-2_e2e
          COGNITO_CLIENT_ID: e2e-client
          COGNITO_CLIENT_SECRET: e2e-client-secret
          COGNITO_DOMAIN: viajacol-e2e.auth.us-east-2.amazoncognito.com
          USERS_TABLE: viajacol-users-e2e

      - name: Guardar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Lighthouse CI (presupuestos de la constitución)
        working-directory: apps/web
        run: |
          # No hay Chrome oficial para Linux ARM64: se usa el Chromium que instaló Playwright.
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx --yes @lhci/cli@0.16.1 autorun

      - name: Guardar reportes de Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/web/.lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
