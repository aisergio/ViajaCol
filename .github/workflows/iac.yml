name: IaC

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/iac.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/iac.yml']

permissions:
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (fmt, validate, TFLint, Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: Formato
        run: terraform fmt -check -recursive infra

      - name: Validar cada stack
        run: |
          for dir in infra/*/; do
            if compgen -G "${dir}*.tf" > /dev/null; then
              echo "::group::${dir}"
              terraform -chdir="${dir}" init -backend=false -input=false
              terraform -chdir="${dir}" validate
              echo "::endgroup::"
            fi
          done

      - name: Preparar TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - name: TFLint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"
          tflint --recursive --chdir infra --config "$GITHUB_WORKSPACE/infra/.tflint.hcl" --format compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra
          framework: terraform
          config_file: infra/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Publicar resultados de Checkov
        if: always()
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: checkov.sarif
          category: checkov
